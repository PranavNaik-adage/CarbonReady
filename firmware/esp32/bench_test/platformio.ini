; PlatformIO config for the standalone RS485 soil sensor bench test.
; This is its own project, separate from the main CarbonReady firmware.
;
; From this directory:
;   pio run -t upload      # build + flash
;   pio device monitor     # serial monitor at 115200

[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
