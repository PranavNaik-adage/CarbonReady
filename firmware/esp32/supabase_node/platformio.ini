; PlatformIO config for the CarbonReady Supabase node.
; Reads the ZTS-3002 soil sensor over Modbus and posts to Supabase over WiFi.
; Self-contained project, separate from the main CarbonReady firmware.
;
; From this directory:
;   pio run -t upload      # build + flash
;   pio device monitor     # serial monitor at 115200
;
; Uses only ESP32 Arduino core libraries (WiFi, WiFiClientSecure) - no extra deps.

[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
